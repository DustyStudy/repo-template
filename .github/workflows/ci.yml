name: CI

# Thin caller: the real jobs live in DustyStudy/DustyStudy and are pinned by
# commit SHA. Dependabot keeps the pins current.
#
# Terraform repo? Uncomment the terraform job. It runs fmt, validate,
# Checkov and a read-only plan; it never applies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    # Gitleaks, Checkov, Trivy and zizmor.
    uses: DustyStudy/DustyStudy/.github/workflows/security-scan.yml@1e19cc9af9614ed0231da72f71886276fe8150b3 # security-scan-v3
    permissions:
      contents: read
      security-events: write
      actions: read

  # Semgrep. Enabled once the shared sast.yml is released (DustyStudy/DustyStudy#76).
